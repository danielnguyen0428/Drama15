services:
  - type: web
    name: drama15-api
    runtime: node
    plan: starter
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm --prefix apps/api ci --include=dev && npm --prefix apps/api run typecheck
    startCommand: npm --prefix apps/api start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: https://drama.novelkit.cc
      - key: OPENAI_BASE_URL
        value: https://api.xah.io/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: MODEL_PRESET
        value: default
      - key: MODEL_PRESET_FREE
        value: free
      - key: MODEL_PRESET_PRO
        value: pro
      - key: MODEL_PRESET_PREMIUM
        value: premium
      - key: AUXILIARY_ANALYSIS_MODEL
        value: deepseek-v4-flash
      - key: ROUTER_DEFAULT_TIMEOUT_MS
        value: "300000"
      - key: ROUTER_PLANNING_TIMEOUT_MS
        value: "240000"
      - key: ROUTER_CHAPTER_TIMEOUT_MS
        value: "600000"
      - key: ROUTER_MAX_RETRIES
        value: "2"
      - key: ROUTER_FALLBACK_ENABLED
        value: "true"
      # ─── autonovel writing upgrades (production) ───────────────────────────
      - key: ADVERSARIAL_CUT_ENABLED
        value: "true"
      - key: READER_PANEL_ENABLED
        value: "true"
      - key: MANUSCRIPT_REVIEW_ENABLED
        value: "true"
      - key: REVISION_LOOP_ENABLED
        value: "true"
      - key: FOUNDATION_GATE_ENABLED
        value: "true"
      - key: CANON_FACTS_ENABLED
        value: "true"
      - key: DEFAULT_LINE_PRESET
        value: billionaire_rich_poor_romance
      - key: DEFAULT_STYLE_PRESET
        value: co_man_warm_modern_blueprint
      - key: DEFAULT_CHAPTER_COUNT
        value: "15"
      - key: WRITE_EXPORT_FILES
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: WEB_PUBLIC_URL
        value: https://drama.novelkit.cc
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ENABLE_POLLING
        value: "true"
      - key: TELEGRAM_STATUS_INTERVAL_MS
        value: "0"
