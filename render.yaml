services:
  - type: web
    name: drama15-api
    runtime: node
    plan: starter
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm --prefix apps/api ci --include=dev && npm --prefix apps/api run typecheck
    startCommand: npm --prefix apps/api start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Asset/config roots must point at the repo root because the start command
      # runs with cwd=apps/api (npm --prefix). Without these, resolveAssetPath()
      # falls back to process.cwd() and preset/corpus loading fails in prod.
      - key: DRAMA15_APP_ROOT
        value: /opt/render/project/src
      - key: DRAMA15_ASSET_ROOT
        value: /opt/render/project/src
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: https://drama.novelkit.cc
      - key: OPENAI_BASE_URL
        value: https://api.xah.io/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: MODEL_PRESET
        value: default
      - key: MODEL_PRESET_FREE
        value: free
      - key: MODEL_PRESET_PRO
        value: pro
      - key: MODEL_PRESET_PREMIUM
        value: premium
      - key: MANAGED_C_PROVIDER_MODEL
        value: tanynguyen97/deepseek-v4-flash [cheap]
      - key: AUXILIARY_ANALYSIS_MODEL
        value: tanynguyen97/deepseek-v4-flash [cheap]
      # Extra provider hosts allowed for per-user LLM settings (comma-separated),
      # on top of the built-in allowlist in llm-settings/urlPolicy.ts.
      - key: LLM_ALLOWED_HOSTS
        value: api.tuongtacfree.vn
      - key: ROUTER_DEFAULT_TIMEOUT_MS
        value: "300000"
      - key: ROUTER_PLANNING_TIMEOUT_MS
        value: "240000"
      - key: ROUTER_CHAPTER_TIMEOUT_MS
        value: "600000"
      - key: ROUTER_MAX_RETRIES
        value: "2"
      - key: ROUTER_FALLBACK_ENABLED
        value: "true"
      # ─── autonovel writing upgrades (production) ───────────────────────────
      # Light profile: keep cheap high-value passes on; heavy full-manuscript
      # passes (reader panel / review) and chapter rewrites (revision) are off
      # to keep latency and token cost down under real traffic.
      - key: ADVERSARIAL_CUT_ENABLED
        value: "true"
      - key: READER_PANEL_ENABLED
        value: "false"
      - key: MANUSCRIPT_REVIEW_ENABLED
        value: "false"
      - key: REVISION_LOOP_ENABLED
        value: "false"
      - key: FOUNDATION_GATE_ENABLED
        value: "true"
      - key: CANON_FACTS_ENABLED
        value: "true"
      - key: DEFAULT_LINE_PRESET
        value: billionaire_rich_poor_romance
      - key: DEFAULT_STYLE_PRESET
        value: co_man_warm_modern_blueprint
      - key: DEFAULT_CHAPTER_COUNT
        value: "15"
      - key: WRITE_EXPORT_FILES
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: LLM_SETTINGS_ENCRYPTION_KEY
        sync: false
      - key: WEB_PUBLIC_URL
        value: https://drama.novelkit.cc
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ENABLE_POLLING
        value: "true"
      - key: TELEGRAM_STATUS_INTERVAL_MS
        value: "0"
